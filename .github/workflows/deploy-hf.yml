name: Deploy to Hugging Face Space

# Runs after every push to main. Needs (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN  = a Hugging Face token with WRITE access
#   variable HF_SPACE  = <hf-username>/<space-name>, e.g. arnesh/visual-qc-copilot
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Drop files the Space does not need (Spaces reject binary files such as PNG figures)
        run: |
          git config user.name "deploy-bot" && git config user.email "deploy-bot@users.noreply.github.com"
          git rm -r -q --cached --ignore-unmatch docs/figures notebooks
          git commit -q -m "space build" || true
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
